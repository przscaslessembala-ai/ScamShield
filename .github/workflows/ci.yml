name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [principal, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilation et tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurer les dépendances
        run: dotnet restore

      - name: Compiler
        run: dotnet build --configuration Release --no-restore

      - name: Lancer les tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
